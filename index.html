<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIbrary</title>
  <link rel="stylesheet" href="stylesheet.css">
  <script src="javascript.js" defer></script>
</head>
<body>
  <div class="header">
    <div class="logo">Library</div>
    <button command="show-modal" commandfor="add-book-dialog">Add book</button>
  </div>
  <div class="main-content">
    <div class="card-container"></div>
  </div>
  <div class="footer">Copyright © jrwells46 2026</div>
  <dialog id="add-book-dialog">
    <form>
      <h3>Add a book...</h3>

      <div class="form-field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="100" required>
      </div>

      <div class="form-field">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" maxlength="100" required>
      </div>

      <div class="form-field">
        <label for="page_count">Page count</label>
        <input type="number" id="page_count" name="page_count" min="1" max="5000" required>
      </div>

      <div class="form-field">
        <label for="title">Summary</label>
        <textarea id="summary" name="summary" required></textarea>
      </div>

      <div class="dialog-button-container">
        <button type="submit" id="dialog_cancel" formnovalidate>Cancel</button>
        <button type="submit" id="dialog_confirm">Add</button>
      </div>
    </form>

  </dialog>
</body>
</html>
